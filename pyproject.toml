[project]
name = "deistools"
version = "0.1.0"
description = "Impedance estimation for slowly time-varying electrochemical systems."
authors = [
    {name = "Federico Scarpioni", email = "federicoscarpioni@gmail.com"},
]
maintainers = [
    {name = "Federico Scarpioni", email = "federicoscarpioni@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    # the readthedocs theme ships with mkdocs; pymdown-extensions supplies the
    # arithmatex/superfences/highlight extensions used in mkdocs.yml
    "pymdown-extensions>=10.0",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Repository = "https://github.com/federicoscarpioni/DEIStools.git"
Issues = "https://github.com/federicoscarpioni/DEIStools/issues"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "S", "UP"]
